name: Build sample app

on:
  workflow_dispatch:
  push:
    branches:
      - ccr-b96e5fe8-1e4mcs

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_USERNAME: ${{ secrets.GH_USERNAME }}
      GH_ACCESS_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check GitHub Packages credentials
        run: |
          if [ -z "$GH_USERNAME" ] || [ -z "$GH_ACCESS_TOKEN" ]; then
            echo "::error::Repository secrets GH_USERNAME and GH_ACCESS_TOKEN (a token with read:packages for tribalfs packages) are required."
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create debug keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android \
            -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build library and sample app
        run: |
          chmod +x ./gradlew
          ./gradlew :oneui-design:assembleRelease :sample-app:assembleDebug --stacktrace

      - name: Upload sample APK
        uses: actions/upload-artifact@v4
        with:
          name: sample-app-debug
          path: sample-app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

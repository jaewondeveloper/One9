name: Compare One UI 9 resources

on:
  workflow_dispatch:
  push:
    branches:
      - ccr-b96e5fe8-1e4mcs
    paths:
      - 'tools/oneui9-compare/**'
      - '.github/workflows/compare-oneui9.yml'

permissions:
  contents: write

jobs:
  compare:
    runs-on: ubuntu-latest
    env:
      GH_USERNAME: ${{ secrets.GH_USERNAME }}
      GH_ACCESS_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download SESL 8 AARs
        run: |
          mkdir -p work/sesl8
          python3 - <<'PY'
          import tomllib, subprocess, sys
          t = tomllib.load(open('gradle/libs.versions.toml', 'rb'))
          vers, libs = t['versions'], t['libraries']
          import os
          for name, l in libs.items():
              if not name.startswith('sesl-') or 'module' not in l: continue
              g, a = l['module'].split(':'); v = vers[l['version']['ref']]
              r = 'sesl-material-components-android' if 'material' in g else 'sesl-androidx'
              ve = v.replace('+', '%2B')
              url = f"https://maven.pkg.github.com/tribalfs/{r}/{g.replace('.', '/')}/{a}/{ve}/{a}-{ve}.aar"
              p = subprocess.run(['curl', '-sSL', '-u', f"{os.environ['GH_USERNAME']}:{os.environ['GH_ACCESS_TOKEN']}",
                                  '-o', f'work/sesl8/{a}.aar', '-w', '%{http_code}', url], capture_output=True, text=True)
              print(a, p.stdout.strip())
              if p.stdout.strip() != '200': sys.exit(1)
          PY

      - name: Get apktool
        working-directory: tools/oneui9-compare
        run: mvn -q -B dependency:copy-dependencies -DoutputDirectory=../../work/apktool

      - name: Download and decode Samsung apps
        run: |
          chmod +x tools/oneui9-compare/fetch_drive.sh
          tools/oneui9-compare/fetch_drive.sh 1GxMWjsy_6qyfPEjWtrPiKkGuW8Psn9ax work/browser.zip
          tools/oneui9-compare/fetch_drive.sh 1CS16zmzMvg3HayP4QBKF6Yc51phZHaey work/notes.apk
          mkdir -p work/b && unzip -q work/browser.zip -d work/b
          for pair in "browser:$(ls work/b/*.apk | head -1)" "notes:work/notes.apk"; do
            n=${pair%%:*}; f=${pair#*:}
            java -cp "work/apktool/*" brut.apktool.Main d -s -f -o "work/dec_$n" "$f" | tail -1
          done

      - name: Compare
        run: python3 tools/oneui9-compare/compare.py work/sesl8 work/dec_browser/res work/dec_notes/res | tee compare.txt

      - uses: actions/upload-artifact@v4
        with:
          name: oneui9-compare
          path: |
            compare.txt
            compare-report.json

      - name: Commit report
        run: |
          mkdir -p docs/oneui9/compare
          cp compare.txt compare-report.json docs/oneui9/compare/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/oneui9/compare
          git commit -m "docs: add SESL 8 vs One UI 9 resource comparison" || echo "nothing to commit"
          git push

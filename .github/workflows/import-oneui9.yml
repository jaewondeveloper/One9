name: Import One UI 9 resources

on:
  workflow_dispatch:
  push:
    branches:
      - ccr-b96e5fe8-1e4mcs
    paths:
      - 'tools/oneui9-import/import_res.py'
      - 'tools/oneui9-import/diff_layouts.py'
      - '.github/workflows/import-oneui9.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    env:
      GH_USERNAME: ${{ secrets.GH_USERNAME }}
      GH_ACCESS_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download SESL 8 AARs
        run: |
          mkdir -p work/sesl8
          python3 - <<'PY'
          import tomllib, subprocess, sys, os
          t = tomllib.load(open('gradle/libs.versions.toml', 'rb'))
          vers, libs = t['versions'], t['libraries']
          for name, l in libs.items():
              if not name.startswith('sesl-') or 'module' not in l: continue
              g, a = l['module'].split(':'); v = vers[l['version']['ref']]
              r = 'sesl-material-components-android' if 'material' in g else 'sesl-androidx'
              ve = v.replace('+', '%2B')
              url = f"https://maven.pkg.github.com/tribalfs/{r}/{g.replace('.', '/')}/{a}/{ve}/{a}-{ve}.aar"
              p = subprocess.run(['curl', '-sSL', '-u', f"{os.environ['GH_USERNAME']}:{os.environ['GH_ACCESS_TOKEN']}",
                                  '-o', f'work/sesl8/{a}.aar', '-w', '%{http_code}', url], capture_output=True, text=True)
              if p.stdout.strip() != '200': print(a, p.stdout); sys.exit(1)
          PY

      - name: Get apktool
        working-directory: tools/oneui9-compare
        run: mvn -q -B dependency:copy-dependencies -DoutputDirectory=../../work/apktool

      - name: Download and decode Gallery (SESL 9 material 1.0.44)
        run: |
          chmod +x tools/oneui9-compare/fetch_drive.sh
          tools/oneui9-compare/fetch_drive.sh 1Xo24PSr1cXYpckv-hV5GMZYPyc1IvuDv work/gallery.apk
          java -cp "work/apktool/*" brut.apktool.Main d -s -f -o work/dec_gallery work/gallery.apk | tail -1

      - name: Import
        run: python3 tools/oneui9-import/import_res.py work/sesl8 work/dec_gallery/res lib/src/main/res docs/oneui9/import-report.txt

      - name: Layout diff (SESL 8 vs One UI 9)
        run: python3 tools/oneui9-import/diff_layouts.py work/sesl8 work/dec_gallery/res docs/oneui9/layout-diff-gallery.txt

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A lib docs tools/oneui9-import
          git commit -m "lib: import One UI 9 resources that differ from SESL 8 (generated)" || echo "nothing to commit"
          git push
